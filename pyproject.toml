[project]
name = "support-triage-agent"
version = "0.1.0"
description = "A local IT support triage agent interview exercise"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "langchain>=1.0,<2.0",
    "langchain-core>=0.3,<2.0",
    "langchain-openai>=1.7,<2.0",
    "langgraph>=0.2,<2.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "langgraph-cli[inmem]>=0.4.42",
    "pytest>=8.3,<9.0",
    "pytest-env>=1.1,<2.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.7,<1.0",
]

[build-system]
requires = ["hatchling>=1.25,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.pytest_env]
CLASSIFIER_PROVIDER = "keyword"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
